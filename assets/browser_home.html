<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Companion Browser</title>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #2c3e50;
            --primary: #3498db;
            --secondary: #95a5a6;
            --card-bg: #ffffff;
            --border: #e1e8ed;
            --hover: #f1f5f8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .section:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }

        .section h2 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-color);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .nav-btn {
            display: inline-block;
            text-align: center;
            padding: 12px 16px;
            background-color: var(--hover);
            color: var(--primary);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-btn:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* Minimalist aesthetics */
        ::selection {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cybersecurity Companion</h1>
            <p>Secure Browser Environment</p>
        </div>

        <div class="section">
            <h2>Search Engines</h2>
            <div class="link-grid">
                <a href="https://google.com" class="nav-btn">Google</a>
                <a href="https://duckduckgo.com" class="nav-btn">DuckDuckGo</a>
                <a href="https://startpage.com" class="nav-btn">Startpage</a>
                <a href="https://search.brave.com" class="nav-btn">Brave Search</a>
            </div>
        </div>

        <div class="section">
            <h2>Email Services</h2>
            <div class="link-grid">
                <a href="https://mail.google.com" class="nav-btn">Gmail</a>
                <a href="https://outlook.live.com" class="nav-btn">Outlook</a>
                <a href="https://proton.me/mail" class="nav-btn">ProtonMail</a>
            </div>
        </div>

        <div class="section">
            <h2>Security Tools</h2>
            <div class="link-grid">
                <a href="https://www.virustotal.com" class="nav-btn">VirusTotal</a>
                <a href="https://haveibeenpwned.com" class="nav-btn">HaveIBeenPwned</a>
                <a href="https://phishtank.org" class="nav-btn">PhishTank</a>
                <a href="https://www.abuseipdb.com" class="nav-btn">AbuseIPDB</a>
                <a href="https://www.urlvoid.com" class="nav-btn">URLVoid</a>
            </div>
        </div>
    </div>
</body>
</html>
